<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Pàgina no trobada</title>
    <style>
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 100px 20px;
            background-color: #0b0210; 
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
        }

        h1 {
            font-size: 64px;
            color: #b054d6; 
            margin-bottom: 10px;
            font-weight: bold;
        }
        p {
            font-size: 1.2rem;
            color: #cccccc; 
            max-width: 600px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn {
            color: #ffffff;
            text-decoration: none;
            padding: 12px 28px;
            border-radius: 50px; 
            background-color: #8a2be2; 
            font-weight: 500;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            display: inline-block;
        }

        .btn:hover {
            background-color: transparent;
            border-color: #8a2be2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(138, 43, 226, 0.3);
        }

        .brand {
            color: #b054d6;
            font-weight: bold;
            margin-bottom: 50px;
            font-size: 1.5rem;
        }
    </style>
</head>

<body>

    <div class="brand">Isaac Guisset</div>

    <h1>404</h1>
    <p>La pàgina que estàs buscant no existeix o ha estat moguda...</p>
    
    <p>
        <a href="/" class="btn">Torna a la pàgina principal</a>
    </p>

</body>

</html>
