<body id="top">

        <div class="nav-container">

            </nav>
        </div>
    </header>
    <main class="portfolio-main">
        <section id="projectes" class="container">
            <h2 class="section-title">Projecte web C# Razor pages</h2>

            <div class="showcase-grid">
                <div class="project-info">
                    <div class="selector-vertical">
                        <button class="sel-btn active" onclick="updateProject('apiv1', this)">
                            <i class="icon"></i> Api ConsellComercal v1
                        </button>
                         <button class="sel-btn active" onclick="updateProject('apiv2', this)">
                            <i class="icon"></i> Api ConsellComercal v2
                        </button>
                       
                    </div>

                    <div class="project-details">
                        <h3 id="proj-title">API v1</h3>
                        <div class="tech-tags">
                            <span>.NET 10</span> <span>C#</span> 
                        </div>
                        <div id="proj-desc" class="readme-style">
                            <p>Carregant documentació...</p>
                        </div>
                        <!-- <a id="proj-github" href="#" target="_blank" class="github-link">Veure a GitHub</a> -->
                    </div>
                </div>

                <div class="browser-window">
                    <div class="browser-header">
                        <span class="dot red"></span>
                        <span class="dot yellow"></span>
                        <span class="dot green"></span>
                    </div>
                    <iframe id="main-frame" src="https://consellcomarcal.isaacsac.com/habitatges" frameborder="0"></iframe>
                </div>




        </section>
    </main>

    <script>

const projectsData = {
    apiv1: {
        title: "Api v1",
        desc: "",
        url: "https://consellcomarcal.isaacsac.com/habitatges",
    },
    apiv2: {
        title: "Api v2",
        desc: "",
        url: "https://consellcomarcalv2.isaacsac.com/habitatges/multiples",
    }

};

function updateProject(key, element) {
    const data = projectsData[key];
    
    const frame = document.getElementById('main-frame');
    if(frame) frame.src = data.url;
    
    document.getElementById('proj-title').innerText = data.title;
    document.getElementById('proj-desc').innerHTML = `<p>${data.desc}</p>`;
    document.getElementById('proj-github').href = data.github;

    document.querySelectorAll('.sel-btn').forEach(btn => btn.classList.remove('active'));
    element.classList.add('active');
}

window.onload = () => {
    const firstBtn = document.querySelector('.sel-btn.active');
    if(firstBtn) updateProject('cavallers', firstBtn);
};
</script>
